services:
  flexi-pomodoro:
    build: .
    ports:
      - "4000:3847"
    environment:
      TZ: Asia/Kolkata
      PORT: "3847"
      DATA_DIR: /data
    volumes:
      # Host path via FPMD_DATA_DIR → bind mount; unset → named volume.
      - ${FPMD_DATA_DIR:-flexi-pomodoro-data}:/data
    restart: unless-stopped

volumes:
  flexi-pomodoro-data:
